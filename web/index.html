const charSkill = DATA.charSkill.filter(e => e.char && e.skill);
const skins = DATA.skins;

let historyCount = 0;

function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function initStars() {
  const box = document.getElementById('stars');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 3 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = Math.random() * 3 + 's';
    box.appendChild(s);
  }
}

function draw() {
  const btn = document.getElementById('drawBtn');
  const poolNow = currentPool();
  if (!poolNow.combos.length) {
    toast(pool.mode === 'custom'
      ? '自定义卡池是空的：把角色/技能加回来，或切回精准模式'
      : '精准卡池里还没有技能，先点右下角「卡池」选一下吧');
    return;
  }
  btn.disabled = true;
  btn.textContent = '抽 卡 中 ...';

  const combo = rand(poolNow.combos);
  const charName = combo.char;
  const skinPool = poolNow.skinMap[charName] || [];
  const skin = skinPool.length ? rand(skinPool) : null;

  const card1 = document.getElementById('card1');
  card1.classList.remove('anim-shake');
  void card1.offsetWidth;
  card1.classList.add('anim-shake');

  setTimeout(() => {
    const r1 = document.getElementById('result1');
    r1.innerHTML = `
      <div class="img-box anim-pop"><img src="${combo.avatar}" alt="${combo.char}" onerror="this.style.display='none'"></div>
      <div class="char-info anim-slide">
        <div class="char-name">${combo.char}</div>
        <div class="skill-label">技 能</div>
        <div class="skill-name">${combo.skill}</div>
      </div>
      <div class="img-box anim-pop"><img src="${combo.skillImg}" alt="${combo.skill}" onerror="this.style.display='none'"></div>
    `;

    const r2 = document.getElementById('result2');
    if (skin) {
      r2.innerHTML = `
        <div class="skin-img-box anim-pop glow"><img src="${skin[1]}" alt="${skin[0]}" onerror="this.style.display='none'"></div>
        <div class="skin-info anim-slide">
          <div class="skin-name">${skin[0]}</div>
          <div class="skin-char">${charName} · 专属皮肤</div>
        </div>
      `;
    } else {
      const anySkin = (skins[charName] || []).length > 0;
      r2.innerHTML = anySkin
        ? `<div class="placeholder">该角色的皮肤都不在卡池里</div>`
        : `<div class="placeholder">该角色暂无皮肤数据</div>`;
    }

    addHistory(combo, skin);
    btn.disabled = false;
    btn.textContent = '再 抽 一 次';
  }, 420);
}

function addHistory(combo, skin) {
  historyCount++;
  const list = document.getElementById('historyList');
  const item = document.createElement('div');
  item.className = 'history-item anim-slide';
  const skinName = skin ? skin[0] : '无皮肤';
  const skinImg = skin ? skin[1] : '';
  item.innerHTML = `
    <span class="h-num">#${historyCount}</span>
    <img src="${combo.avatar}" onerror="this.style.display='none'">
    <span class="h-char">${combo.char}</span>
    <span class="h-skill">${combo.skill}</span>
    <span class="h-arrow">→</span>
    ${skinImg ? `<img src="${skinImg}" onerror="this.style.display='none'">` : ''}
    <span class="h-skin">${skinName}</span>
  `;
  list.prepend(item);
  document.getElementById('history').style.display = 'block';
  while (list.children.length > 20) list.removeChild(list.lastChild);
  updateStats();
}

function updateStats() {
  const totalSkins = Object.values(skins).reduce((a, b) => a + b.length, 0);
  const p = currentPool();
  const pooledSkins = Object.values(p.skinMap).reduce((a, b) => a + b.length, 0);
  const el = document.getElementById('stats');
  const isPreciseFull = pool.mode === 'precise' && p.chars.size === CHAR_LIST.length && p.combos.length === charSkill.length && pooledSkins === totalSkins;
  const modeName = pool.mode === 'custom' ? '自定义' : '精准';
  el.innerHTML = isPreciseFull
    ? `共 <b>${charSkill.length}</b> 个角色技能组合 · <b>${Object.keys(skins).length}</b> 位角色 · <b>${totalSkins}</b> 款皮肤`
    : `${modeName}卡池：<b>${p.chars.size}</b> 位角色 · <b>${p.combos.length}</b> 个技能 · <b>${pooledSkins}</b> 款皮肤（全部 ${charSkill.length} / ${totalSkins}）`;
  const hint = document.getElementById('modeHint');
  if (hint) {
    hint.innerHTML = `正在用 <b>${modeName}卡池</b> 抽卡 · ${p.chars.size} 位角色 / ${p.combos.length} 个技能 / ${pooledSkins} 款皮肤`;
  }
  const summary = document.getElementById('poolSummary');
  if (summary) updatePoolSummary();
}

/* ================= 卡池设置 ================= */
const POOL_KEY = 'yqqs.pool.v1';
const CHAR_LIST = (() => {
  const seen = new Set();
  const list = [];
  charSkill.forEach(e => { if (!seen.has(e.char)) { seen.add(e.char); list.push(e.char); } });
  Object.keys(skins).forEach(c => { if (!seen.has(c)) { seen.add(c); list.push(c); } });
  return list;
})();
const CHAR_AVATAR = (() => {
  const map = {};
  charSkill.forEach(e => { if (!map[e.char]) map[e.char] = e.avatar; });
  Object.keys(skins).forEach(c => { if (!map[c]) map[c] = (skins[c][0] || [])[1] || ''; });
  return map;
})();
const TOTAL_SKINS = Object.values(skins).reduce((a, b) => a + b.length, 0);

const pool = {
  chars: new Set(CHAR_LIST),
  seenChars: new Set(CHAR_LIST),
  offSkill: new Set(),   // 精准模式取消勾选的技能
  offSkin: new Set(),    // 精准模式取消勾选的皮肤
  cutChars: new Set(),   // 自定义模式整卡移出的角色
  cutSkill: new Set(),   // 自定义模式再删掉的技能
  cutSkin: new Set(),    // 自定义模式再删掉的皮肤
  mode: 'precise'        // 当前按哪个卡池抽卡：precise / custom
};

const skillKey = (c, s) => c + '\u0001' + s;
const skinKey = (c, n) => c + '\u0001' + n;

function loadPool() {
  let raw = null;
  try { raw = localStorage.getItem(POOL_KEY); } catch (e) { /* 无痕模式 */ }
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    const seen = new Set(d.seenChars || []);
    const chars = new Set((d.chars || []).filter(c => CHAR_LIST.indexOf(c) >= 0));
    CHAR_LIST.forEach(c => { if (!seen.has(c)) chars.add(c); });   // 数据更新后新增的角色默认进池
    pool.chars = chars;
    pool.offSkill = new Set(d.offSkill || []);
    pool.offSkin = new Set(d.offSkin || []);
    pool.cutChars = new Set(d.cutChars || []);
    pool.cutSkill = new Set(d.cutSkill || []);
    pool.cutSkin = new Set(d.cutSkin || []);
    pool.mode = d.mode === 'custom' ? 'custom' : 'precise';
  } catch (e) { /* 存档坏了就用默认全收集 */ }
}

function savePool() {
  pool.seenChars = new Set(CHAR_LIST);
  try {
    localStorage.setItem(POOL_KEY, JSON.stringify({
      chars: [...pool.chars],
      seenChars: [...pool.seenChars],
      offSkill: [...pool.offSkill],
      offSkin: [...pool.offSkin],
      cutChars: [...pool.cutChars],
      cutSkill: [...pool.cutSkill],
      cutSkin: [...pool.cutSkin],
      mode: pool.mode
    }));
  } catch (e) {}
}

const skillsOfChar = c => charSkill.filter(e => e.char === c);

function finishPool(combos, skinMap) {
  const chars = new Set(combos.map(e => e.char));
  Object.keys(skinMap).forEach(c => chars.add(c));
  return { combos, skinMap, chars };
}

/* 精准卡池：角色 + 逐条勾选的技能/皮肤 */
function precisePool() {
  const combos = charSkill.filter(e => pool.chars.has(e.char) && !pool.offSkill.has(skillKey(e.char, e.skill)));
  const skinMap = {};
  Object.keys(skins).forEach(c => {
    if (!pool.chars.has(c)) return;
    const list = skins[c].filter(s => !pool.offSkin.has(skinKey(c, s[0])));
    if (list.length) skinMap[c] = list;
  });
  return finishPool(combos, skinMap);
}

/* 自定义卡池：在精准卡池基础上再整卡/逐条删减 */
function customPool() {
  const base = precisePool();
  const combos = base.combos.filter(e => !pool.cutChars.has(e.char) && !pool.cutSkill.has(skillKey(e.char, e.skill)));
  const skinMap = {};
  Object.keys(base.skinMap).forEach(c => {
    if (pool.cutChars.has(c)) return;
    const list = base.skinMap[c].filter(s => !pool.cutSkin.has(skinKey(c, s[0])));
    if (list.length) skinMap[c] = list;
  });
  return finishPool(combos, skinMap);
}

/* 抽卡按“当前模式”对应的卡池走 */
function currentPool() {
  return pool.mode === 'custom' ? customPool() : precisePool();
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
}

/* ---- 侧边栏 UI ---- */
const poolDrawer = document.getElementById('poolDrawer');
const poolMask = document.getElementById('poolMask');
const poolBody = document.getElementById('poolBody');
const poolSummary = document.getElementById('poolSummary');
const poolToastEl = document.getElementById('poolToast');
let poolTab = 'precise';
let cutQuery = '';
let toastTimer = null;

function toast(msg) {
  poolToastEl.textContent = msg;
  poolToastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => poolToastEl.classList.remove('show'), 2400);
}

function openPool() {
  poolDrawer.classList.add('open');
  poolMask.classList.add('open');
  document.body.classList.add('pool-open');
  renderPool();
}
function closePool() {
  poolDrawer.classList.remove('open');
  poolMask.classList.remove('open');
  document.body.classList.remove('pool-open');
}

function poolSizeText(p) {
  const skinsIn = Object.values(p.skinMap).reduce((a, b) => a + b.length, 0);
  return `${p.chars.size} 角色 · ${p.combos.length} 技能 · ${skinsIn} 皮肤`;
}

function updatePoolSummary() {
  const pr = precisePool();
  const cu = customPool();
  poolSummary.innerHTML =
    `<div>精准卡池：<b>${poolSizeText(pr)}</b></div>` +
    `<div>自定义卡池：<b>${poolSizeText(cu)}</b></div>` +
    `<div style="color:#5f6f93">当前抽卡：${pool.mode === 'custom' ? '自定义' : '精准'}卡池</div>`;
}

function renderPool() {
  if (poolTab === 'precise') renderPrecise();
  else renderCustom();
  updatePoolSummary();
  updateStats();
}

function renderPrecise() {
  const scroll = poolBody.scrollTop;
  const enabledSkills = charSkill.filter(e => pool.chars.has(e.char) && !pool.offSkill.has(skillKey(e.char, e.skill)));
  let enabledSkins = 0;
  Object.keys(skins).forEach(c => {
    if (!pool.chars.has(c)) return;
    skins[c].forEach(s => { if (!pool.offSkin.has(skinKey(c, s[0]))) enabledSkins++; });
  });

  const chips = CHAR_LIST.map(c => {
    const on = pool.chars.has(c);
    return `<button class="char-chip ${on ? 'on' : 'off'}" data-char="${esc(c)}" type="button" aria-pressed="${on}">
      <img src="${CHAR_AVATAR[c]}" alt="" onerror="this.style.visibility='hidden'"><span>${esc(c)}</span>
    </button>`;
  }).join('');

  const skillBlocks = CHAR_LIST.filter(c => pool.chars.has(c) && skillsOfChar(c).length).map(c => {
    const list = skillsOfChar(c);
    const on = list.filter(e => !pool.offSkill.has(skillKey(c, e.skill))).length;
    return `<details class="pool-item" data-char="${esc(c)}" data-count-label="技能">
      <summary><img src="${CHAR_AVATAR[c]}" alt="" onerror="this.style.visibility='hidden'">
        <span class="name">${esc(c)}</span><span class="count">${on}/${list.length} 技能</span></summary>
      <div class="list">${list.map(e => {
        const checked = !pool.offSkill.has(skillKey(c, e.skill));
        return `<label class="check-row"><input type="checkbox" data-kind="skill" data-char="${esc(c)}" data-name="${esc(e.skill)}" ${checked ? 'checked' : ''}>
          <img src="${e.skillImg}" alt="" onerror="this.style.visibility='hidden'">
          <span class="label">${esc(e.skill)}</span></label>`;
      }).join('')}</div></details>`;
  }).join('');

  const skinBlocks = CHAR_LIST.filter(c => pool.chars.has(c) && (skins[c] || []).length).map(c => {
    const list = skins[c];
    const on = list.filter(s => !pool.offSkin.has(skinKey(c, s[0]))).length;
    return `<details class="pool-item" data-char="${esc(c)}" data-count-label="皮肤">
      <summary><img src="${CHAR_AVATAR[c]}" alt="" onerror="this.style.visibility='hidden'">
        <span class="name">${esc(c)}</span><span class="count">${on}/${list.length} 皮肤</span></summary>
      <div class="list">${list.map(s => {
        const checked = !pool.offSkin.has(skinKey(c, s[0]));
        return `<label class="check-row"><input type="checkbox" data-kind="skin" data-char="${esc(c)}" data-name="${esc(s[0])}" ${checked ? 'checked' : ''}>
          <img src="${s[1]}" alt="" onerror="this.style.visibility='hidden'">
          <span class="label">${esc(s[0])}</span></label>`;
      }).join('')}</div></details>`;
  }).join('');

  poolBody.innerHTML = `
    <div class="pool-note">默认全收集。这里的改动只影响抽卡卡池，不会影响数据本身。</div>
    <div class="pool-section">
      <div class="pool-section-head"><span>① 选择卡池角色</span><b>${pool.chars.size}/${CHAR_LIST.length}</b>
        <div class="mini-btns"><button data-act="chars-all" type="button">全选</button><button data-act="chars-none" type="button">清空</button><button data-act="chars-invert" type="button">反选</button></div>
      </div>
      <div class="chip-grid">${chips}</div>
    </div>
    <div class="pool-section">
      <div class="pool-section-head"><span>② 勾选技能</span><b>${enabledSkills.length}/${charSkill.length}</b>
        <div class="mini-btns"><button data-act="skills-all" type="button">全选</button><button data-act="skills-none" type="button">全不选</button></div>
      </div>
      ${skillBlocks || '<div class="empty-tip">还没有选择角色。</div>'}
    </div>
    <div class="pool-section">
      <div class="pool-section-head"><span>③ 勾选皮肤</span><b>${enabledSkins}/${TOTAL_SKINS}</b>
        <div class="mini-btns"><button data-act="skins-all" type="button">全选</button><button data-act="skins-none" type="button">全不选</button></div>
      </div>
      ${skinBlocks || '<div class="empty-tip">还没有选择角色。</div>'}
    </div>`;
  poolBody.scrollTop = scroll;
}

function renderCustom() {
  const scroll = poolBody.scrollTop;
  const q = cutQuery.toLowerCase();
  let html = `<input class="pool-search" id="cutSearch" placeholder="搜索角色 / 技能 / 皮肤…" value="${esc(cutQuery)}">
    <div class="pool-note">这是<b>自定义卡池</b>：在精准卡池的基础上整卡移出角色，或逐条取消技能 / 皮肤。只有切到「自定义模式」时，抽卡才会用这套卡池。</div>
    <div class="pool-section-head"><span>精准卡池里的角色 <b>${CHAR_LIST.filter(c => pool.chars.has(c)).length}</b> 位</span>
      <div class="mini-btns"><button data-act="cut-reset" type="button">恢复未删减</button></div></div>`;

  const chars = CHAR_LIST.filter(c => pool.chars.has(c));
  if (!chars.length) html += `<div class="empty-tip">还没有选择任何角色，先去「精准模式」选角色吧。</div>`;

  chars.forEach(c => {
    const list = [];
    skillsOfChar(c).forEach(e => { if (!pool.offSkill.has(skillKey(c, e.skill))) list.push({ kind: 'skill', name: e.skill, img: e.skillImg, tag: '技能' }); });
    (skins[c] || []).forEach(s => { if (!pool.offSkin.has(skinKey(c, s[0]))) list.push({ kind: 'skin', name: s[0], img: s[1], tag: '皮肤' }); });
    if (!list.length) return;
    let shown = list;
    if (q && c.toLowerCase().indexOf(q) < 0) shown = list.filter(x => x.name.toLowerCase().indexOf(q) >= 0);
    if (!shown.length) return;
    const charCut = pool.cutChars.has(c);
    const inPool = charCut ? 0 : shown.filter(x => x.kind === 'skill' ? !pool.cutSkill.has(skillKey(c, x.name)) : !pool.cutSkin.has(skinKey(c, x.name))).length;
    html += `<details class="pool-item ${charCut ? 'is-cut' : ''}" data-char="${esc(c)}" data-count-label="在池" ${q ? 'open' : ''}>
      <summary><img src="${CHAR_AVATAR[c]}" alt="" onerror="this.style.visibility='hidden'">
        <span class="name">${esc(c)}</span>
        <span class="count">${charCut ? '已移出' : inPool + '/' + shown.length + ' 在池'}</span></summary>
      <div class="list">
        <label class="check-row char-row">
          <input type="checkbox" data-kind="char" data-char="${esc(c)}" ${charCut ? '' : 'checked'}>
          <span class="label" style="color:#ffd54f;font-weight:700">整个角色</span>
          <span class="tag">${charCut ? '已移出卡池' : '在卡池中'}</span>
        </label>
        ${shown.map(x => {
          const on = !charCut && (x.kind === 'skill' ? !pool.cutSkill.has(skillKey(c, x.name)) : !pool.cutSkin.has(skinKey(c, x.name)));
          return `<label class="check-row ${charCut ? 'disabled' : ''}"><input type="checkbox" data-kind="${x.kind}" data-char="${esc(c)}" data-name="${esc(x.name)}" ${on ? 'checked' : ''} ${charCut ? 'disabled' : ''}>
            <img src="${x.img}" alt="" onerror="this.style.visibility='hidden'">
            <span class="label">${esc(x.name)}</span><span class="tag">${x.tag}</span></label>`;
        }).join('')}
      </div></details>`;
  });

  poolBody.innerHTML = html;
  poolBody.scrollTop = scroll;
  const search = poolBody.querySelector('#cutSearch');
  if (search) {
    search.addEventListener('input', ev => {
      cutQuery = ev.target.value;
      const top = poolBody.scrollTop;
      renderCustom();
      const again = poolBody.querySelector('#cutSearch');
      if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
      poolBody.scrollTop = top;
    });
  }
}

function refreshDetailsCount(details) {
  if (!details) return;
  const boxes = details.querySelectorAll('input[data-kind="skill"],input[data-kind="skin"]');
  const on = details.querySelectorAll('input[data-kind="skill"]:checked,input[data-kind="skin"]:checked').length;
  const label = details.dataset.countLabel || '条目';
  const count = details.querySelector('.count');
  const charBox = details.querySelector('input[data-kind="char"]');
  if (charBox && !charBox.checked) {
    if (count) count.textContent = '已移出';
    return;
  }
  if (count) count.textContent = `${on}/${boxes.length} ${label}`;
}

function toggleChar(c) {
  if (pool.chars.has(c)) pool.chars.delete(c); else pool.chars.add(c);
  savePool();
  renderPrecise();
  updatePoolSummary();
  updateStats();
}

function applyPoolAction(act) {
  if (act === 'chars-all') pool.chars = new Set(CHAR_LIST);
  else if (act === 'chars-none') pool.chars = new Set();
  else if (act === 'chars-invert') {
    const next = new Set();
    CHAR_LIST.forEach(c => { if (!pool.chars.has(c)) next.add(c); });
    pool.chars = next;
  } else if (act === 'skills-all') pool.offSkill.clear();
  else if (act === 'skills-none') charSkill.forEach(e => pool.offSkill.add(skillKey(e.char, e.skill)));
  else if (act === 'skins-all') pool.offSkin.clear();
  else if (act === 'skins-none') Object.keys(skins).forEach(c => skins[c].forEach(s => pool.offSkin.add(skinKey(c, s[0]))));
  else if (act === 'cut-reset') { pool.cutChars.clear(); pool.cutSkill.clear(); pool.cutSkin.clear(); }
  else return;
  savePool();
  renderPool();
}

poolBody.addEventListener('click', e => {
  const chip = e.target.closest('.char-chip');
  if (chip) { toggleChar(chip.dataset.char); return; }
  const act = e.target.closest('[data-act]');
  if (act) applyPoolAction(act.dataset.act);
});

poolBody.addEventListener('change', e => {
  const cb = e.target;
  if (!cb || cb.type !== 'checkbox') return;
  const c = cb.dataset.char;
  if (!c) return;
  if (cb.dataset.kind === 'char') {
    if (cb.checked) pool.cutChars.delete(c); else pool.cutChars.add(c);
    savePool();
    renderCustom();
    updatePoolSummary();
    updateStats();
    return;
  }
  const name = cb.dataset.name;
  if (name === undefined) return;
  const k = cb.dataset.kind === 'skill' ? skillKey(c, name) : skinKey(c, name);
  if (poolTab === 'precise') {
    const set = cb.dataset.kind === 'skill' ? pool.offSkill : pool.offSkin;
    if (cb.checked) set.delete(k); else set.add(k);
  } else {
    const set = cb.dataset.kind === 'skill' ? pool.cutSkill : pool.cutSkin;
    if (cb.checked) set.delete(k); else set.add(k);
  }
  savePool();
  updatePoolSummary();
  updateStats();
  refreshDetailsCount(cb.closest('details'));
});

/* 模式切换：决定用精准卡池还是自定义卡池抽卡 */
function syncModeUI() {
  Array.from(document.querySelectorAll('.mode-btn')).forEach(b => {
    const on = b.dataset.mode === pool.mode;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  Array.from(document.querySelectorAll('.pool-tab')).forEach(b => {
    b.classList.toggle('active', b.dataset.tab === pool.mode);
  });
}

function setMode(mode, rerender) {
  pool.mode = mode === 'custom' ? 'custom' : 'precise';
  poolTab = pool.mode;
  savePool();
  syncModeUI();
  if (rerender !== false) renderPool();
  updateStats();
  updatePoolSummary();
}

document.getElementById('modeSwitch').addEventListener('click', e => {
  const btn = e.target.closest('.mode-btn');
  if (btn) setMode(btn.dataset.mode);
});

document.getElementById('poolTabs').addEventListener('click', e => {
  const btn = e.target.closest('.pool-tab');
  if (!btn) return;
  setMode(btn.dataset.tab);
});
document.getElementById('poolFab').addEventListener('click', openPool);
document.getElementById('poolClose').addEventListener('click', closePool);
poolMask.addEventListener('click', closePool);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && poolDrawer.classList.contains('open')) closePool();
});
document.getElementById('poolReset').addEventListener('click', () => {
  pool.chars = new Set(CHAR_LIST);
  pool.offSkill.clear(); pool.offSkin.clear();
  pool.cutChars.clear(); pool.cutSkill.clear(); pool.cutSkin.clear();
  savePool();
  renderPool();
  toast('已恢复全收集卡池');
});

loadPool();
poolTab = pool.mode;
syncModeUI();

document.getElementById('drawBtn').addEventListener('click', draw);
initStars();
updateStats();
</script>
</body>
</html>
